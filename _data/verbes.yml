# Étape « Feuilles » : les quatre verbes.
- titre: "Je fabrique"
  texte: "Design de produit et fabrication numérique : œuvres interactives pour le musée Sensorium à Berne, fourchettes totems de la Semaine du goût, le jeu *Yapasphoto*."
- titre: "Je forme"
  texte: "Médiation et formations en fablab pour tous les publics depuis 2016, formations pour enseignant·es avec la HEP-BEJUNE, cours FreeCAD pas à pas en préparation."
- titre: "Je fédère"
  texte: "Low-Tech Festilab, FabLab La Chaux-de-Fonds, Girls* on Ice, Swiss TecLadies : des projets qui tiennent parce que beaucoup de gens les portent."
- titre: "Je documente"
  texte: "Un carnet sur ce site, des notes de recherche, du sketchnoting, et une rubrique « De notre production » pour le magazine 1000METRES."
