# Site de Mélanie Thomas — construit automatiquement par GitHub Pages (Jekyll).
title: MélaLab
author: Mélanie Thomas
description: "Entre design, low-tech et communs : je fabrique, je forme, je fédère et je documente."
lang: fr
url: "https://melalab.ch"
baseurl: ""

# Les articles du carnet sont dans le dossier _posts (un fichier Markdown par article).
permalink: /carnet/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

timezone: Europe/Zurich

# Une page par projet (dossier _projets), à l'adresse /projets/nom-du-projet/
collections:
  projets:
    output: true
    permalink: /projets/:name/

# Flux RSS du carnet (/feed.xml), extension prise en charge par GitHub Pages
plugins:
  - jekyll-feed
feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projets
    values:
      layout: projet

# Rubriques du carnet (champ « rubrique » de chaque article)
rubriques:
  - Low-tech & sobriété
  - Faire & tiers-lieux
  - Design, soin & handicap
  - Sciences & transmission

exclude:
  - README.md
  - MODELE-ARTICLE.md
