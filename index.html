---
layout: null
titre_onglet: "MélaLab — Mélanie Thomas, design, low-tech et communs"
---
<!doctype html>
<html lang="fr">
<head>
{% include head.html %}
</head>
<body>
  <div class="plant" aria-hidden="true">
    <svg id="plant-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
  </div>

{% include entete.html %}

  <ol class="stages" id="stages" aria-label="Stades de la plante"></ol>

  <main class="stage">
    <article class="card" id="card" aria-live="polite" tabindex="-1">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <div class="body" id="body"></div>
      <div class="aside-note" id="aside" hidden></div>
      <nav class="choices" id="choices" aria-label="Où aller ensuite ?"></nav>
    </article>
  </main>

  <footer class="foot">
    <p>MélaLab · Mélanie Thomas · site sobre, sans traceur · <a href="{{ '/en-bref/' | relative_url }}">tout le site en une page</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>

  <noscript>
    <div class="noscript">
      <h1>Mélanie Thomas</h1>
      <p>Entre design, low-tech et communs&nbsp;: je fabrique, je forme, je fédère et je documente.</p>
      <p><a href="{{ '/en-bref/' | relative_url }}">Lire tout le site en une page</a> · <a href="{{ '/carnet/' | relative_url }}">Le carnet</a> · <a href="mailto:melanie.thomas.design@gmail.com">melanie.thomas.design@gmail.com</a></p>
    </div>
  </noscript>

  <!-- Derniers articles du carnet, générés par GitHub Pages à partir du dossier _posts -->
  <script id="posts-data" type="application/json">[{% for post in site.posts limit:3 %}{"title": {{ post.title | jsonify }}, "url": {{ post.url | relative_url | jsonify }}, "date": {{ post.date | date: "%d.%m.%Y" | jsonify }}, "rubrique": {{ post.rubrique | jsonify }}, "resume": {{ post.resume | default: post.excerpt | strip_html | strip_newlines | truncate: 170 | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
  <!-- Contenus du parcours, tirés du dossier _data (modifiables dans Pages CMS) -->
  <script id="site-data" type="application/json">{"accueil": {{ site.data.accueil | jsonify }}, "racines": {{ site.data.racines | jsonify }}, "reseau": {{ site.data.reseau | jsonify }}, "interventions": {{ site.data.interventions | jsonify }}, "verbes": {{ site.data.verbes | jsonify }}, "projets": [{% assign projets = site.projets | sort: "ordre" %}{% for p in projets %}{"titre": {{ p.title | jsonify }}, "meta": {{ p.meta | jsonify }}, "texte": {{ p.resume | jsonify }}, "url": {{ p.url | relative_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>
  <script>window.SITE = { carnet: "{{ '/carnet/' | relative_url }}", rss: "{{ '/feed.xml' | relative_url }}" };</script>
  <script src="{{ '/assets/plante.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/parcours.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
